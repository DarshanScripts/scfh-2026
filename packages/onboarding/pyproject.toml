[project]
name = "hilhack-onboarding"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "qdrant-client>=1.15,<2",
    "rank-bm25>=0.2,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-httpx>=0.35,<1",
]
