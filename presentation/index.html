<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relay | Presentation designs</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { margin: 0; }
    main { max-width: 1080px; margin: auto; padding: clamp(24px, 6vw, 72px); }
    header img { width: 64px; display: block; }
    h1 { margin: .22em 0 .12em; font: 600 clamp(2.8rem, 8vw, 5.5rem)/.96 Arial, Helvetica, sans-serif; }
    header p { margin: .8rem 0 2.5rem; color: var(--muted); }
    ul { margin: 0; list-style: none; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    li a { display: grid; grid-template-columns: minmax(10rem, 1fr) 2fr auto; gap: 1rem; align-items: center; color: inherit; text-decoration: none; padding: 1rem .5rem; }
    li a:hover, li a:focus-visible { background: var(--soft); }
    li strong { font: 600 2.2rem Arial, Helvetica, sans-serif; }
    li span { color: var(--muted); line-height: 1.4; }
    footer { display: flex; gap: 1.3rem; flex-wrap: wrap; margin-top: 1.7rem; }
    footer a { color: var(--ink); text-underline-offset: 3px; }
    @media (max-width: 550px) { li a { grid-template-columns: 1fr auto; } li span:not([aria-hidden]) { grid-row: 2; grid-column: 1 / -1; } }
  </style>
</head>

    </ul>
    <footer><a href="PRESENTER.md">Presenter guide and sources</a><a href="assets/orange-whisky.png">Team logo</a></footer>
  </main>
</body>
</html>
